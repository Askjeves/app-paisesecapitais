<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Master - Países e Capitais</title>
    <link rel="stylesheet" href="style.css?v=1" />
</head>
<body>

    <div class="app-container" id="app">


        <!-- ========== ECRÃ INICIAL ========== -->
        <div id="startScreen">
            <div class="logo" style="font-size:2.5rem; margin-bottom:40px;">Quiz Master - Países e Capitais</div>


            <!-- NÍVEIS -->
            <div class="level-selector">
                <span style="color:#94a3b8; font-weight:600; font-size:0.95rem;"></span>
                <button class="level-btn active" data-level="basico">Básico</button>
                <button class="level-btn" data-level="intermedio">Intermédio</button>
                <button class="level-btn" data-level="avancado">Avançado</button>
            </div>


            <p style="color:#94a3b8; margin-bottom:30px; font-size:0.95rem;">
			<br>
                Crie um novo jogador ou selecione um jogador da lista
            </p>


            <div class="player-form">
                <input type="text" id="newPlayerInput" placeholder="Nome do novo jogador" />
                <button class="btn btn-primary" id="createPlayerBtn">Criar Jogador</button>
            </div>
            <div class="player-list" id="playerList">
                <p style="color:#94a3b8; margin-bottom:12px;">Jogadores existentes</p>
            </div>
        </div>

        <!-- ========== ECRÃ DE JOGO ========== -->
        <div id="gameScreen" style="display:none;">

            <div class="top-bar">
                <div style="display:flex; justify-content:flex-end; align-items:center; gap:12px; width:100%;">
                    <span id="playerNameDisplay" style="color:#facc15; font-weight:600;"></span>
                    <button class="btn btn-secondary" id="logoutBtn" style="padding:6px 16px; font-size:0.8rem;">Sair</button>
                </div>
            </div>

            <!-- Pergunta -->
            <div class="question-box" id="questionDisplay">—</div>

            <!-- Opções (4 botões) -->
            <div class="options-grid" id="optionsGrid">
                <button class="option-btn" data-index="0">A. ...</button>
                <button class="option-btn" data-index="1">B. ...</button>
                <button class="option-btn" data-index="2">C. ...</button>
                <button class="option-btn" data-index="3">D. ...</button>
            </div>

            <div class="action-area">
                <button class="btn btn-warning" id="hintBtn">🔍 Dica (eliminar opção)</button>
                <button class="btn btn-danger" id="resetBtn" disabled>🔄 Nova Pergunta</button>
            </div>

            <div style="margin-top:16px;">
                <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
                    <span style="color:#94a3b8; font-size:0.9rem;">✅ Progresso</span>
                    <span style="color:#94a3b8; font-size:0.9rem;" id="progressDisplay">0/0</span>
                </div>
                <div style="width:100%; height:8px; background:rgba(255,255,255,0.1); border-radius:20px; overflow:hidden; margin-top:4px;">
                    <div id="gameProgressFill" style="width:0%; height:100%; background:#34d399; border-radius:20px; transition:width 0.4s ease;"></div>
                </div>
            </div>
        </div>

        <!-- ========== ECRÃ DE JOGO COMPLETO ========== -->
        <div id="completeScreen" style="display:none; padding:40px 0;">
            <div style="font-size:4rem; margin-bottom:20px;">🎉</div>
            <div class="logo" style="font-size:2rem; margin-bottom:10px;">Parabéns!</div>
            <p style="color:#94a3b8; font-size:1.2rem;">Completaste todas as perguntas disponíveis deste nível!</p>
            <p style="color:#94a3b8; margin:10px 0 20px;">Podes recomeçar o teu progresso neste nível.</p>
            <button class="btn btn-primary" id="resetProgressBtn">🔄 Recomeçar Progresso</button>
            <button class="btn btn-secondary" id="logoutCompleteBtn" style="margin-left:12px;">Sair</button>
        </div>

    </div>

    <!-- ===== FIREBASE ===== -->

</body>
